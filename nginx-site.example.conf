# 统一支付网关的 Nginx 站点配置模板
#
# 适用于服务器上已经有 Nginx 的情况：网关用基础的 docker compose up -d 启动（监听 8080），
# 由 Nginx 负责 HTTPS 与转发，无需再引入 Caddy。
#
# 使用方法：
#   1. 把本文件复制为站点配置，并把 pay.example.com 全部替换成你的域名
#        sudo cp nginx-site.example.conf /etc/nginx/sites-available/epay.conf
#        sudo ln -s /etc/nginx/sites-available/epay.conf /etc/nginx/sites-enabled/
#      （CentOS / RHEL 系放到 /etc/nginx/conf.d/epay.conf 即可，无需软链）
#   2. 申请证书（以 certbot 为例，会自动改写本文件中的证书路径并配置续期）
#        sudo apt install -y certbot python3-certbot-nginx
#        sudo certbot --nginx -d pay.example.com
#   3. 检查并重载
#        sudo nginx -t && sudo systemctl reload nginx
#
# 注意：config.yaml 中请保持 server.trust_proxy: true，网关才能从下面转发的
# X-Forwarded-For 中取到买家真实 IP；同时不要把网关的 8080 端口暴露到公网。

upstream epay_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP：证书校验放行，其余跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pay.example.com;

    # certbot 的 HTTP-01 校验目录（使用 --nginx 方式时不需要，保留无害）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # Nginx < 1.25.1 请删除本行，并把上面两行改为 listen 443 ssl http2;
    server_name pay.example.com;

    # 证书路径：用 certbot --nginx 申请时会自动填写为下面这样
    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 管理后台前端的 JS / CSS 较大，开启压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml;

    # 管理后台接口会提交密钥、证书内容，放宽请求体上限
    client_max_body_size 2m;

    access_log /var/log/nginx/epay.access.log;
    error_log  /var/log/nginx/epay.error.log;

    # 整站转发给网关：/submit.php、/mapi.php、/api.php、/notify/、/pay/、/admin/ 都在其中，
    # 注意不要对 /notify/ 做 IP 白名单，否则收不到支付宝 / 微信 / PayPal / Stripe 的回调。
    location / {
        proxy_pass http://epay_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 可选：给管理后台加一层 IP 白名单（只影响 /admin/，不影响支付与回调）
    # location /admin/ {
    #     allow 1.2.3.4;          # 换成你的办公网 / 家庭宽带出口 IP
    #     deny all;
    #
    #     proxy_pass http://epay_gateway;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
